[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dealflow-ingestion"
version = "0.1.0"
description = "DealFlow AI data ingestion pipelines"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3"
]

[tool.setuptools.packages.find]
where = ["src"]
