environment: development
api:
  host: 0.0.0.0
  port: 8000
database:
  url: ${DATABASE_URL}
cache:
  url: ${REDIS_URL}
scoring:
  # Data ingestion + rescoring runs Mon/Wed/Fri; lead assignment runs Tue 06:00.
  # These are scheduler cron expressions, not a polling interval.
  ingestion_cron: "0 10 * * 1,3,5"
  assignment_cron: "0 6 * * 2"
